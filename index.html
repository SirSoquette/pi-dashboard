<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI progress</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --surface-2: #f3f2ee;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6; --good: #006300; --bad: #b42d2d;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9b9991;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --good: #0ca30c; --bad: #e66767;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9b9991;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --good: #0ca30c; --bad: #e66767;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; }
.sub { color: var(--text-muted); font-size: 13px; }
.theme-btn { margin-left: auto; }
button, .chip { font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover, .chip:hover { background: var(--surface-2); }
button:focus-visible, .chip:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }

.filters { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.filters .label { color: var(--text-secondary); font-size: 13px; margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="false"] { color: var(--text-muted); background: transparent; }
.chip[aria-pressed="false"] .key { opacity: .25; }
.key { display: inline-block; width: 16px; height: 2px; border-radius: 1px; background: currentColor; }
select.chip { appearance: auto; padding: 5px 8px; }
.custom-range { display: inline-flex; align-items: center; gap: 6px; }
.custom-range[hidden] { display: none; }
input[type="date"] { font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
.bar { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--grid);
  vertical-align: middle; margin-right: 8px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
td.idea { white-space: normal; min-width: 240px; max-width: 420px; text-align: left; }
td.idea a { color: var(--accent); text-decoration: none; font-weight: 600; margin-right: 6px; }
td.idea a:hover { text-decoration: underline; }
td.left { text-align: left; white-space: normal; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-secondary); }
.sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 6px; }

details.picker { position: static; }
details.picker > summary { list-style: none; }
details.picker > summary::-webkit-details-marker { display: none; }
.picker-panel { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0;
  width: min(760px, 100%); max-height: 70vh; overflow: auto;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 12px 16px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 20px; }
.picker-panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--text-muted); margin: 4px 0 6px; font-weight: 600; }
.picker-panel label { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; cursor: pointer; }
.picker-panel .actions { grid-column: 1 / -1; display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }

.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.snapshot { margin-bottom: 16px; overflow-x: auto; }
.snapshot h2, .chart h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
.snapshot .hint, .chart .hint { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--text-secondary); font-size: 12px; }
td .delta { font-size: 12px; margin-left: 6px; color: var(--text-muted); }
td .team { display: inline-flex; align-items: center; gap: 8px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.chart { position: relative; }
.chart-head { display: flex; gap: 8px; align-items: flex-start; }
.chart-head .titles { flex: 1; min-width: 0; }
.chart-head button { font-size: 12px; padding: 3px 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
svg .end-label { font-size: 11px; font-weight: 600; fill: var(--text-secondary); }
.tip { position: absolute; z-index: 10; pointer-events: none; min-width: 180px; max-width: 280px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16); padding: 8px 10px; font-size: 12px; display: none; }
.tip .d { color: var(--text-muted); margin-bottom: 4px; }
.tip .row { display: grid; grid-template-columns: 14px auto 1fr; gap: 6px; align-items: center; padding: 1px 0; }
.tip .row b { font-size: 13px; font-variant-numeric: tabular-nums; }
.tip .row span:last-child { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip .note { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--grid); color: var(--text-secondary); }
.empty { color: var(--text-muted); padding: 32px 0; text-align: center; }
.data-table { margin-top: 8px; overflow-x: auto; }
@media (max-width: 600px) { h1 { font-size: 19px; } .theme-btn { margin-left: 0; } }
</style>
</head>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <span class="sub" id="sub"></span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">Theme</button>
  </header>

  <div class="filters" role="toolbar" aria-label="Filters">

    <span class="sep" aria-hidden="true"></span>
    <span class="label">Teams</span>
    <span id="teamChips" style="display:contents"></span>
    <span class="sep" aria-hidden="true"></span>
    <details class="picker" id="picker">
      <summary class="chip" id="pickerBtn">Metrics</summary>
      <div class="picker-panel" id="pickerPanel"></div>

  <section class="card snapshot" aria-labelledby="snapTitle">
    <h2 id="snapTitle">Latest snapshot</h2>

  <div class="grid" id="charts"></div>

    <h2 id="commitTitle">Commitments</h2>
    <div class="hint" id="commitHint"></div>
    <div id="commitTable"></div>
  </section>
</div>

<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const META = Object.fromEntries(D.metrics.map(m => [m.name, m]));
// color follows the team, never its rank: "All teams", then teams active in the newest PI, then older ones
const _newest = (D.periods || []).at(-1);
const _active = new Set(D.records.filter(r => _newest && r.date >= _newest.start).map(r => r.team));
const _order = D.teams.slice().sort((a, b) => (b === "All teams") - (a === "All teams") || _active.has(b) - _active.has(a) || a.localeCompare(b));
const TEAM_SLOT = Object.fromEntries(_order.map((t, i) => [t, (i % 8) + 1]));
const DATES = [...new Set(D.records.map(r => r.date))].sort();
const BY = {};  // BY[team][date] = record
for (const r of D.records) (BY[r.team] ||= {})[r.date] = r;

const store = {
  get(k, d) { try { const v = localStorage.getItem("pi:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pi:" + k, JSON.stringify(v)); } catch {} },
};
// Teams start switched on only if they had a snapshot in the 90 days before the newest one;
// retired boards stay one click away in the team chips.
const RECENT = _newest ? [..._active] : (() => {
  const cutoff = new Date(DATES.at(-1) + "T00:00:00"); cutoff.setDate(cutoff.getDate() - 90);
  const live = D.teams.filter(t => Object.keys(BY[t] || {}).some(d => new Date(d + "T00:00:00") >= cutoff));
  return live.length ? live : D.teams;
})();
const state = {
  teams: new Set(store.get("teams", RECENT).filter(t => D.teams.includes(t))),
  metrics: store.get("metrics", D.defaults).filter(m => META[m]),
  hover: null,
  tables: new Set(),
};
// ---- date range: presets count back from the newest data, not from today
const PERIODS = (D.periods || []).slice().reverse();          // newest PI first
const PRESETS = [...PERIODS.map(p => ["pi:" + p.name, p.name + " PI", null]),
                 ["3m", "Last 3 months", 3], ["6m", "Last 6 months", 6], ["12m", "Last 12 months", 12],
                 ["all", "All", null], ["custom", "Custom…", null]];
const DEFAULT_PRESET = PERIODS.length ? "pi:" + PERIODS[0].name : "6m";
state.range = store.get("range", { preset: DEFAULT_PRESET });
if (!PRESETS.some(p => p[0] === state.range.preset)) state.range = { preset: DEFAULT_PRESET };
const selectedPI = () => {
  const p = state.range.preset.startsWith("pi:") ? state.range.preset.slice(3) : null;
  return PERIODS.find(x => x.name === p) || PERIODS[0];
};
let RANGE = [DATES[0], DATES.at(-1)];
function computeRange() {
  const { preset, from, to } = state.range, last = DATES.at(-1);
  if (preset === "all") return [DATES[0], last];
  if (preset === "custom") return [from || DATES[0], to || last];
  if (preset.startsWith("pi:")) { const p = selectedPI(); return [p.start, p.end < last ? p.end : last]; }
  const months = PRESETS.find(p => p[0] === preset)[2];
  const d = new Date(last + "T00:00:00"); d.setMonth(d.getMonth() - months);
  return [d.toISOString().slice(0, 10), last];
}
const inRange = d => d >= RANGE[0] && d <= RANGE[1];
if (!state.teams.size) D.teams.forEach(t => state.teams.add(t));
if (!state.metrics.length) state.metrics = D.defaults.slice();

const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "text") n.textContent = v; else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c));
  return n;
};
const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const short = t => t.includes(" - ") ? t.split(" - ").pop() : t;
const color = t => `var(--series-${TEAM_SLOT[t]})`;
const fmtDate = (s, long) => new Date(s + "T00:00:00").toLocaleDateString(undefined,
  long ? { year: "numeric", month: "short", day: "numeric" } : { month: "short", day: "numeric" });
const fmt = (m, v) => {
  if (v == null) return "–";
  if (META[m]?.percent) return Math.round(v * 100) + "%";
  return Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : (+v.toFixed(1)).toLocaleString();
};
const val = (team, date, m) => BY[team]?.[date]?.values[m] ?? null;
const activeTeams = () => _order.filter(t => state.teams.has(t));

// ---------------------------------------------------------------- header + theme
document.getElementById("title").textContent = D.title;
document.getElementById("sub").textContent =
  `${D.teams.length} teams · ${DATES.length} snapshots (${fmtDate(DATES[0], 1)} – ${fmtDate(DATES.at(-1), 1)}) · from ${D.source}, built ${fmtDate(D.generated, 1)}`;
const themeBtn = document.getElementById("themeBtn");
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get("theme", null));
themeBtn.onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
  const next = dark ? "light" : "dark"; applyTheme(next); store.set("theme", next); renderCharts();
};

// ---------------------------------------------------------------- filters
const rangeSel = document.getElementById("rangeSel"), customBox = document.getElementById("customRange");
const fromD = document.getElementById("fromD"), toD = document.getElementById("toD");
for (const [v, label] of PRESETS) rangeSel.append(el("option", { value: v, text: label }));
for (const inp of [fromD, toD]) { inp.min = DATES[0]; inp.max = DATES.at(-1); }
function applyRange() {
  RANGE = computeRange();
  rangeSel.value = state.range.preset;
  customBox.hidden = state.range.preset !== "custom";
  fromD.value = RANGE[0]; toD.value = RANGE[1];
  store.set("range", state.range);
}
rangeSel.onchange = () => {
  state.range = rangeSel.value === "custom" ? { preset: "custom", from: RANGE[0], to: RANGE[1] } : { preset: rangeSel.value };
  applyRange(); renderAll();
};
for (const inp of [fromD, toD]) inp.onchange = () => {
  if (!fromD.value || !toD.value) return;
  const [a, b] = [fromD.value, toD.value].sort();
  state.range = { preset: "custom", from: a, to: b };
  applyRange(); renderAll();
};
applyRange();

const chipsHost = document.getElementById("teamChips");
for (const t of _order) {
  const b = el("button", { class: "chip", type: "button", "aria-pressed": String(state.teams.has(t)), title: t },
    el("span", { class: "key", style: `color:${color(t)}` }), el("span", { text: short(t) }));
  b.onclick = () => {
    state.teams.has(t) ? state.teams.delete(t) : state.teams.add(t);
    b.setAttribute("aria-pressed", String(state.teams.has(t)));
    store.set("teams", [...state.teams]); renderAll();
  };
  chipsHost.append(b);
}

const panel = document.getElementById("pickerPanel");
const pickerBtn = document.getElementById("pickerBtn");
function buildPicker() {
  panel.replaceChildren();
  const groups = {};
  for (const m of D.metrics) (groups[m.group] ||= []).push(m);
  for (const [g, ms] of Object.entries(groups)) {
    const box = el("div", {}, el("h3", { text: g }));
    for (const m of ms) {
      const cb = el("input", { type: "checkbox" });
      cb.checked = state.metrics.includes(m.name);
      cb.onchange = () => {
        state.metrics = cb.checked ? [...state.metrics, m.name] : state.metrics.filter(x => x !== m.name);
        store.set("metrics", state.metrics); renderAll();
      };
      box.append(el("label", { title: m.note || "" }, cb, el("span", { text: m.name })));
    }
    panel.append(box);
  }
  panel.append(el("div", { class: "actions" },
    el("button", { type: "button", text: "Reset to defaults", onclick: () => { state.metrics = D.defaults.slice(); store.set("metrics", state.metrics); buildPicker(); renderAll(); } }),
    el("button", { type: "button", text: "Clear all", onclick: () => { state.metrics = []; store.set("metrics", []); buildPicker(); renderAll(); } })));
}
document.addEventListener("click", e => { const p = document.getElementById("picker"); if (p.open && !p.contains(e.target)) p.open = false; });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("picker").open = false; });

// ---------------------------------------------------------------- snapshot table
function renderSnapshot() {
  const host = document.getElementById("snapTable");
  const teams = activeTeams();
  document.getElementById("snapHint").textContent =
    "Each team's most recent row in the selected range, with the change since its previous snapshot.";
  if (!teams.length || !state.metrics.length) { host.replaceChildren(el("div", { class: "empty", text: "Pick at least one team and one metric." })); return; }
  const head = el("tr", {}, el("th", { text: "Team" }), el("th", { text: "As of" }), state.metrics.map(m => el("th", { text: m })));
  const rows = teams.filter(t => Object.keys(BY[t] || {}).some(inRange)).map(t => {
    const ds = Object.keys(BY[t] || {}).filter(inRange).sort();
    const last = ds.at(-1), prev = ds.at(-2);
    return el("tr", {},
      el("td", {}, el("span", { class: "team" }, el("span", { class: "key", style: `color:${color(t)}` }), el("span", { text: short(t) }))),
      el("td", { text: last ? fmtDate(last) : "–" }),
      state.metrics.map(m => {
        const v = val(t, last, m), p = prev ? val(t, prev, m) : null;
        const td = el("td", { text: fmt(m, v) });
        if (v != null && p != null && v !== p) {
          const d = v - p, s = d > 0 ? "▲ " : "▼ ";
          td.append(el("span", { class: "delta", text: s + fmt(m, Math.abs(d)) }));
        }
        return td;
      }));
  });
  host.replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, rows)));
}

// ---------------------------------------------------------------- charts
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { hi = lo + 1; }
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => raw <= s);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const out = []; for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}

const charts = [];
function renderCharts() {
  const host = document.getElementById("charts");
  host.replaceChildren(); charts.length = 0;
  if (!state.metrics.length) { host.append(el("div", { class: "card empty", text: "No metrics selected — open Metrics to pick some." })); return; }
  for (const m of state.metrics) {
    const card = el("section", { class: "card chart", "aria-label": m });
    const tableBtn = el("button", { type: "button", text: state.tables.has(m) ? "Hide table" : "Table" });
    tableBtn.onclick = () => { state.tables.has(m) ? state.tables.delete(m) : state.tables.add(m); renderCharts(); };
    const removeBtn = el("button", { type: "button", text: "✕", "aria-label": `Remove ${m}` });
    removeBtn.onclick = () => { state.metrics = state.metrics.filter(x => x !== m); store.set("metrics", state.metrics); buildPicker(); renderAll(); };
    card.append(el("div", { class: "chart-head" },
      el("div", { class: "titles" }, el("h2", { text: m }), el("div", { class: "hint", text: META[m].note || (META[m].group + (META[m].percent ? " · shown as %" : "")) })),
      tableBtn, removeBtn));
    const teams = activeTeams().filter(t => Object.keys(BY[t] || {}).some(d => inRange(d) && val(t, d, m) != null));
    card.append(el("div", { class: "legend" }, teams.map(t => el("span", {}, el("span", { class: "key", style: `color:${color(t)}` }), el("span", { text: short(t) })))));
    host.append(card);
    charts.push(drawChart(card, m, teams));
    if (state.tables.has(m)) card.append(dataTable(m, teams));
  }
  syncHover();
}

function dataTable(m, teams) {
  const rows = DATES.filter(d => inRange(d) && teams.some(t => val(t, d, m) != null)).map(d =>
    el("tr", {}, el("td", { text: fmtDate(d, 1) }), teams.map(t => el("td", { text: fmt(m, val(t, d, m)) }))));
  return el("div", { class: "data-table" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", { text: "Snapshot" }), teams.map(t => el("th", { text: short(t) })))),
    el("tbody", {}, rows)));
}

function drawChart(card, m, teams) {
  const W = Math.max(280, card.clientWidth - 32), H = 226;
  const pad = { l: 44, r: 52, t: 10, b: 36 };
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": `${m} over time by team` });
  const series = teams.map(t => ({ t, pts: DATES.filter(inRange).map(d => ({ d, v: val(t, d, m) })).filter(p => p.v != null) })).filter(s => s.pts.length);
  if (!series.length) {
    card.append(el("div", { class: "empty", text: "No data for the selected teams in this date range." }));
    return { m, set() {} };
  }
  const all = series.flatMap(s => s.pts.map(p => p.v));
  const LD = [...new Set(series.flatMap(s => s.pts.map(p => p.d)))].sort();   // this chart's own time range
  const ticks = niceTicks(Math.min(0, ...all), Math.max(...all));
  const y0 = ticks[0], y1 = ticks.at(-1);
  const t0 = +new Date(LD[0]), t1 = +new Date(LD.at(-1));
  const x = d => pad.l + (t1 === t0 ? (W - pad.l - pad.r) / 2 : ((+new Date(d) - t0) / (t1 - t0)) * (W - pad.l - pad.r));
  const y = v => pad.t + (1 - (v - y0) / (y1 - y0)) * (H - pad.t - pad.b);

  // grid + y ticks
  for (const tv of ticks) {
    svg.append(svgEl("line", { x1: pad.l, x2: W - pad.r, y1: y(tv), y2: y(tv), stroke: tv === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const tx = svgEl("text", { x: pad.l - 8, y: y(tv) + 4, "text-anchor": "end" }); tx.textContent = fmt(m, tv); svg.append(tx);
  }
  // x ticks: drop any label that would sit within 52px of one already placed (last date always wins)
  const placed = [];
  for (const d of [LD.at(-1), ...LD.slice(0, -1)]) {
    if (placed.some(p => Math.abs(x(p) - x(d)) < 52)) continue;
    placed.push(d);
    const tx = svgEl("text", { x: x(d), y: H - 4, "text-anchor": "middle" }); tx.textContent = fmtDate(d); svg.append(tx);
  }
  // notes markers along the baseline
  for (const d of LD) if (teams.some(t => BY[t]?.[d]?.notes)) {
    const cx = x(d), cy = H - pad.b + 4;
    const mk = svgEl("path", { d: `M${cx - 4},${cy + 7} L${cx + 4},${cy + 7} L${cx},${cy} Z`, fill: "var(--text-muted)" });
    mk.append(svgEl("title")); mk.firstChild.textContent = "This snapshot has a note (hover for details)"; svg.append(mk);
  }
  // crosshair (under lines)
  const cross = svgEl("line", { y1: pad.t, y2: H - pad.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  // lines + markers
  const markers = [];
  for (const s of series) {
    const dPath = s.pts.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    svg.append(svgEl("path", { d: dPath, fill: "none", stroke: color(s.t), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    for (const p of s.pts) {
      const c = svgEl("circle", { cx: x(p.d), cy: y(p.v), r: 3, fill: color(s.t), stroke: "var(--surface-1)", "stroke-width": 2 });
      c.dataset.d = p.d; svg.append(c); markers.push(c);
    }
  }
  // direct end labels, de-overlapped
  const ends = series.map(s => ({ t: s.t, y: y(s.pts.at(-1).v), x: x(s.pts.at(-1).d) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
  for (const e of ends) { const tx = svgEl("text", { x: e.x + 8, y: e.y + 4, class: "end-label" }); const lbl = short(e.t); tx.textContent = lbl.length > 14 ? lbl.slice(0, 13) + "…" : lbl;
    tx.append(svgEl("title")); tx.lastChild.textContent = e.t; svg.append(tx); }

  // hover layer
  const hit = svgEl("rect", { x: pad.l - 10, y: 0, width: W - pad.l - pad.r + 20, height: H, fill: "transparent", tabindex: 0 });
  svg.append(hit);
  const nearest = evt => {
    const r = svg.getBoundingClientRect(), px = (evt.clientX - r.left) * (W / r.width);
    return LD.reduce((a, d) => Math.abs(x(d) - px) < Math.abs(x(a) - px) ? d : a, LD[0]);
  };
  hit.addEventListener("pointermove", e => { state.hover = nearest(e); syncHover(m); });
  hit.addEventListener("pointerleave", () => { state.hover = null; syncHover(); });
  hit.addEventListener("focus", () => { state.hover ??= LD.at(-1); syncHover(m); });
  hit.addEventListener("blur", () => { state.hover = null; syncHover(); });
  hit.addEventListener("keydown", e => {
    const i = Math.max(0, LD.indexOf(state.hover ?? LD.at(-1)));
    if (e.key === "ArrowLeft") state.hover = LD[Math.max(0, i - 1)];
    else if (e.key === "ArrowRight") state.hover = LD[Math.min(LD.length - 1, i + 1)];
    else return;
    e.preventDefault(); syncHover(m);
  });

  const tip = el("div", { class: "tip", role: "status" });
  card.append(svg, tip);

  return {
    m,
    set(d, showTip) {
      if (!d || d < LD[0] || d > LD.at(-1)) { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; markers.forEach(c => c.setAttribute("r", 3)); return; }
      cross.setAttribute("x1", x(d)); cross.setAttribute("x2", x(d)); cross.setAttribute("visibility", "visible");
      markers.forEach(c => c.setAttribute("r", c.dataset.d === d ? 5 : 3));
      if (!showTip) { tip.style.display = "none"; return; }
      tip.replaceChildren(el("div", { class: "d", text: `Snapshot ${fmtDate(d, 1)}` }));
      const notes = new Set();
      for (const t of teams) {
        const rec = BY[t]?.[d];
        tip.append(el("div", { class: "row" },
          el("span", { class: "key", style: `color:${color(t)}` }),
          el("b", { text: fmt(m, rec?.values[m]) }),
          el("span", { text: `${short(t)}${rec?.sprint ? " · " + rec.sprint : ""}` })));
        if (rec?.notes) notes.add(rec.notes);
      }
      notes.forEach(n => tip.append(el("div", { class: "note", text: "Note: " + n })));
      tip.style.display = "block";
      const cw = card.clientWidth, tw = tip.offsetWidth;
      const cr = card.getBoundingClientRect(), sr = svg.getBoundingClientRect();
      const svgLeft = sr.left - cr.left, scale = sr.width / W;
      let left = svgLeft + x(d) * scale + 12;
      if (left + tw > cw - 8) left = svgLeft + x(d) * scale - tw - 12;
      tip.style.left = Math.max(8, left) + "px";
      tip.style.top = (sr.top - cr.top + 8) + "px";
    },
  };
}

// Crosshair is shared: hovering any chart marks the same snapshot in all of them; the tooltip shows on the active one.
function syncHover(active) { for (const c of charts) c.set(state.hover, c.m === active); }

// ---------------------------------------------------------------- commitments (ideas in the PI)
function renderCommitments() {
  const card = document.getElementById("commitCard");
  const pi = selectedPI();
  if (!D.items || !pi) { card.hidden = true; return; }
  card.hidden = false;
  const teams = activeTeams(), all = teams.includes("All teams");
  const rows = D.items.filter(i => i.pi === pi.name && (all || i.teams.some(t => teams.includes(t))));
  const pct = i => i.points_total ? i.points_done / i.points_total : (i.stories_total ? i.stories_done / i.stories_total : (i.done ? 1 : 0));
  const cmp = (x, y) => (x < y ? -1 : x > y ? 1 : 0);              // Jira Rank sorts by plain character order
  rows.sort((a, b) => cmp(a.rank || "~", b.rank || "~") || cmp(a.key, b.key));
  const n = k => rows.filter(k).length;
  document.getElementById("commitTitle").textContent = `Commitments · ${pi.name}`;
  document.getElementById("commitHint").textContent =
    `${n(i => i.kind === "Planned")} committed at planning · ${n(i => i.kind === "Added after planning")} added after · ` +
    `${n(i => i.kind === "Descoped")} descoped · ${n(i => i.done)} done as of today. In Jira Rank order; click an idea to open it in Jira.` +
    (titlesLocked ? " Idea titles are hidden on the public page; open it from Confluence to see them." : "");
  const host = document.getElementById("commitTable");
  if (!rows.length) { host.replaceChildren(el("div", { class: "empty", text: "No ideas for the selected teams in this PI." })); return; }
  const head = el("tr", {}, ["#", "Idea", "Team(s)", "Commitment", "Status", "Epics done", "Story points done"].map(h => el("th", { text: h })));
  const body = rows.map((i, n) => {
    const p = pct(i);
    const ptsText = i.points_total ? `${fmtN(i.points_done)} / ${fmtN(i.points_total)}`
                  : i.stories_total ? `${i.stories_done} / ${i.stories_total} stories` : (i.epics_total ? "no stories yet" : "no epics linked");
    return el("tr", {},
      el("td", { text: String(n + 1) }),
      el("td", { class: "idea" }, el("a", { href: i.url, target: "_blank", rel: "noopener", text: i.key }), el("span", { text: i.summary || "" })),
      el("td", { class: "left", text: i.teams.join(", ") }),
      el("td", { class: "left" }, el("span", { class: "pill", text: i.kind })),
      el("td", { class: "left", text: i.done ? "Done" : i.status }),
      el("td", { text: i.epics_total ? `${i.epics_done} / ${i.epics_total}` : "–" }),
      el("td", {}, el("span", { class: "bar", "aria-hidden": "true" }, el("span", { style: `width:${Math.round(p * 100)}%` })),
        el("span", { text: `${Math.round(p * 100)}% · ${ptsText}` })));
  });
  host.replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, body)));
}
const fmtN = v => (+v.toFixed(1)).toLocaleString();


// ---------------------------------------------------------------- sealed idea titles (public copy)
// Titles are AES-CTR + HMAC encrypted in the page. The key comes from the link's #k=… (never sent
// to a server) and is remembered in this browser, so only people with the full link see titles.
let titlesLocked = !!D.sealedTitles;
async function unlockTitles() {
  if (!D.sealedTitles || !(window.crypto && crypto.subtle)) return;
  const b64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
  const fromHash = new URLSearchParams(location.hash.slice(1)).get("k");
  const k = fromHash || store.get("titleKey", null);
  if (!k) return;
  try {
    const te = new TextEncoder(), sc = crypto.subtle;
    const master = await sc.importKey("raw", b64(k), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const sub = async label => new Uint8Array(await sc.sign("HMAC", master, te.encode(label)));
    const { iv, ct, tag } = D.sealedTitles, ivB = b64(iv), ctB = b64(ct);
    const mac = await sc.importKey("raw", await sub("pi-mac"), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const signed = new Uint8Array(ivB.length + ctB.length); signed.set(ivB); signed.set(ctB, ivB.length);
    if (!(await sc.verify("HMAC", mac, b64(tag), signed))) throw new Error("wrong key");
    const aes = await sc.importKey("raw", await sub("pi-enc"), "AES-CTR", false, ["decrypt"]);
    const titles = JSON.parse(new TextDecoder().decode(await sc.decrypt({ name: "AES-CTR", counter: ivB, length: 64 }, aes, ctB)));
    for (const i of D.items) i.summary = titles[i.key] || "";
    titlesLocked = false;
    store.set("titleKey", k);
    renderCommitments();
  } catch { if (!fromHash) store.set("titleKey", null); }   // remembered key is out of date
}

function renderAll() { renderSnapshot(); renderCommitments(); renderCharts(); }
buildPicker(); renderAll(); unlockTitles();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderCharts, 120); });
})();
</script>
